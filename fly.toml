# Supply the Fly app name and region explicitly at launch/deploy time. They are
# intentionally absent here until residency, latency, and Supabase reachability
# have been reviewed.
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile.control"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 25
    hard_limit = 50

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    timeout = "3s"
    path = "/health/ready"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
