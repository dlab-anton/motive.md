name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check publication boundary
        run: |
          node --test scripts/check-publication.test.mjs
          node scripts/check-publication.mjs

      - name: Check types
        run: npm run check

      - name: Test libraries
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify Claude Desktop extension
        working-directory: packages/claude-desktop-mcp
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
          npm run pack:mcpb
